[build-system]
requires = ['setuptools~=82.0.1']
build-backend = 'setuptools.build_meta'

[project]
name = "gemeaspy"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko~=3.5.1",
    "pytest~=9.0.2",
    "cosmic-ray~=8.4.4"
]

[tool.setuptools.packages.find]
include = ["gemeaspy*"]

[project.scripts]
gemeaspy = "gemeaspy.acquisition:run_acquisition"
gemeaspy_backup = "gemeaspy.handling.backup:main"
gemeaspy_reset = "gemeaspy.handling.reset:main"