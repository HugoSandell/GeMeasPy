[build-system]
requires = ['setuptools~=82.0.1']
build-backend = 'setuptools.build_meta'

[project]
name = "gemeaspy"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko~=3.5.1",
    "pytest~=9.0.2",
    "cosmic-ray~=8.4.4",
    "coverage~=7.13.4",
    "pytest-asyncio~=1.3.0",
    "psutil~7.2.2",
]

[tool.setuptools.packages.find]
include = ["gemeaspy*"]

[project.scripts]
gemeaspy = "gemeaspy.acquisition:cli_main"
gemeaspy_backup = "gemeaspy.handling.backup:main"
gemeaspy_reset = "gemeaspy.handling.reset:main"