[pytest]
minversion = "9.0.2"
log_level = "DEBUG"
log_file_level = "DEBUG"
log_file_mode = "a"
log_file = "log/pytest_log.txt"
log_file_format = "%(asctime)s %(levelname)s %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = [
    "gemeaspy/tests",
]
addopts = [
    "--capture=tee-sys",
    "--cache-clear",
    "--maxfail=15",
]